# Confere e publica a wiki (docs/) a cada push na main.
#
# Sao DOIS jobs no MESMO workflow, e o `publicar` depende do `qualidade`. Dois
# workflows independentes permitiriam publicar documentacao que nao passou nos
# portoes -- que e exatamente o que a D13 existe para impedir.
#
# O Pages deste repositorio serve da branch `gh-pages`, que NAO existe no
# repositorio de codigo: quem a cria e a mantem e o `mike`, e cada versao
# publicada vira um diretorio dentro dela. Ver a secao "Documentacao" do
# CONTRIBUTING.md para o passo a passo da configuracao do Pages e para o
# caminho de volta (como despublicar).

name: Documentacao

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
      # As tres linhas abaixo entraram na D13, e nao sao enfeite: sem elas,
      # mexer no vocabulario do Vale ou no verificador de links nunca
      # reexecutaria o portao que aquela mudanca configura. Mesmo argumento que
      # colocou o docs-requirements.txt nesta lista na D02.
      - ".vale.ini"
      - ".vale/**"
      - "scripts/verificar-links.mjs"
      - "package.json"
      - ".github/workflows/docs.yml"
  # Execucao manual. Existe por dois motivos praticos: o Pages so pode ser
  # apontado para a `gh-pages` depois que ela existir, e ela so nasce no
  # primeiro deploy; e republicar depois de um deploy ruim nao deveria exigir
  # um commit de mentira em docs/.
  workflow_dispatch:

permissions:
  contents: write # o mike faz commit e push na branch gh-pages

# Dois deploys simultaneos disputariam a mesma branch e o segundo perderia.
# Aqui nao se cancela o que esta em andamento: um deploy interrompido no meio
# do push deixaria a gh-pages num estado que ninguem escolheu.
concurrency:
  group: docs-pages
  cancel-in-progress: false

# Versoes FIXADAS, pelo mesmo motivo do docs-requirements.txt: o site e
# publicado por uma Action, e faixa de versao faria o portao de amanha ser outro
# sem que nenhum commit mudasse. O Vale e o lychee sao binarios (Go e Rust) e
# por isso nao cabem no docs-requirements.txt, que e Python -- as mesmas versoes
# estao na receita de instalacao local do CONTRIBUTING.md.
env:
  VERSAO_VALE: "3.18.0"
  VERSAO_LYCHEE: "0.24.2"

jobs:
  qualidade:
    name: Portoes de qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          # A mesma versao em que a stack foi conferida na maquina de
          # desenvolvimento (3.14.0).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          # O verificador de links so usa a biblioteca padrao do Node; a versao
          # e a mesma em que ele foi conferido.
          node-version: "24"

      - name: Instalar as ferramentas da wiki
        run: pip install -r docs-requirements.txt

      - name: Instalar o Vale
        run: |
          mkdir -p .tools/vale
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VERSAO_VALE}/vale_${VERSAO_VALE}_Linux_64-bit.tar.gz" \
            | tar -xz -C .tools/vale vale
          .tools/vale/vale --version

      # O tarball do lychee tem diretorio de topo (o do Vale, acima, nao tem),
      # dai o --strip-components. Conferido listando os dois arquivos.
      - name: Instalar o lychee
        run: |
          mkdir -p .tools/lychee
          curl -sSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${VERSAO_LYCHEE}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C .tools/lychee --strip-components=1 \
                "lychee-x86_64-unknown-linux-gnu/lychee"
          .tools/lychee/lychee --version

      # Portao 1 -- build estrito. Ele ja vinha sendo usado desde a D02 na
      # verificacao manual; aqui virou obrigacao. Pega referencia a pagina
      # inexistente no `nav` e link para arquivo que nao existe.
      #
      # O que ele NAO pega, e por isso o portao 3 existe: ancora quebrada. O
      # MkDocs classifica "o doc nao contem a ancora #x" como INFO, e `--strict`
      # so promove WARNING a erro. Medido nas tarefas D08, D11, D12 e de novo na
      # D13 -- o build sai em 0 com a ancora quebrada impressa na saida.
      - name: Construir em modo estrito
        run: mkdocs build --strict

      # Portao 2 -- vocabulario controlado nas paginas em portugues, estilo
      # Microsoft nas em ingles. O `sync` baixa o pacote Microsoft na versao
      # fixada no .vale.ini.
      #
      # Nao ha bandeira de severidade aqui de proposito: medido, o Vale sai em 1
      # quando existe pelo menos um alerta de nivel `error`, e em 0 com qualquer
      # quantidade de `warning` e `suggestion`. O criterio da D13 -- aviso nao
      # quebra o build, erro sim -- e o comportamento nativo dele.
      - name: Conferir o texto (Vale)
        run: |
          .tools/vale/vale sync
          .tools/vale/vale docs/

      # Portao 3 -- links e ancoras, sobre o site construido. O comando e o
      # mesmo que roda na maquina de quem escreve (`npm run docs:links`), e os
      # argumentos moram no script: duplica-los aqui criaria a segunda copia
      # que diverge em silencio. O porque de o alvo ser o site, e nao `docs/`,
      # esta no cabecalho de scripts/verificar-links.mjs.
      - name: Conferir os links (lychee)
        run: npm run docs:links

  publicar:
    name: Publicar no Pages
    runs-on: ubuntu-latest
    # A dependencia E o portao. Sem esta linha, os dois jobs correriam em
    # paralelo e a wiki subiria antes de qualquer conferencia -- o mesmo efeito
    # de ter dois workflows separados.
    needs: qualidade

    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          # O mike precisa do historico e da branch gh-pages remota; com o
          # checkout raso ele nao enxerga a versao ja publicada e reescreveria
          # a branch do zero.
          fetch-depth: 0

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Instalar as ferramentas da wiki
        run: pip install -r docs-requirements.txt

      - name: Identificar o autor dos commits do mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # O `mike deploy` roda o build por dentro, mas NAO aceita `--strict`
      # (conferido em `mike deploy --help`). Quem faz o build estrito e o job
      # `qualidade`, do qual este depende -- por isso o passo nao se repete aqui.
      #
      # A v1.0 e o estado congelado que esta wiki descreve (spec-wiki §2.1).
      # Quando a Tarefa 13 entrar, ela vira v1.1 e as duas convivem: o mike
      # publica cada versao num diretorio proprio e o seletor do cabecalho
      # alterna entre elas.
      - name: Publicar a versao v1.0
        run: mike deploy --push --update-aliases v1.0 --title "v1.0"

      # A raiz do site redireciona para a versao padrao. Ela aponta para a
      # v1.0 por decisao explicita: quando a v1.1 sair, alguem roda
      # `mike set-default v1.1` de proposito, em vez de a raiz mudar sozinha.
      - name: Apontar o padrao para a v1.0
        run: mike set-default --push v1.0
