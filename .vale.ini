# Vocabulario controlado da wiki (tarefa D03).
#
# NAO existe lint de estilo em portugues aqui, e isso e deliberado: os estilos
# prontos do Vale (Microsoft, Google) sao escritos para ingles, e nao ha estilo
# pronto de qualidade para PT-BR (spec-wiki.md §6.1). O que existe e um
# vocabulario proprio, que resolve o problema que importa -- duas paginas
# discordarem do nome da mesma coisa.
#
# O estilo Microsoft para as paginas em ingles entra na D13, junto com o resto
# do CI.
#
# Uso:  vale docs/
# Instalacao: secao "Documentacao" do CONTRIBUTING.md.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Wiki

# Escopo restrito a docs/ de proposito. A raiz do repositorio tem spec.md,
# AGENTS.md e os enunciados de tarefa, que sao notas de trabalho e usam
# "usuario" e "aluno" livremente -- linta-los encheria a saida de ruido, e
# linter ruidoso e linter que a proxima pessoa desliga.
#
# SAO DUAS SECOES, e a segunda nao e redundante: `docs/**/*.md` NAO casa
# docs/index.md, e `docs/**.md` NAO casa docs/referencia/glossario.md. Medido
# nesta maquina -- com so o segundo padrao, `vale docs/` dizia "0 files" para a
# arvore inteira abaixo do primeiro nivel e saia com sucesso. Linter que nunca
# acusou nada parece configurado; este estava mudo.
#
# Vale.Spelling e um corretor de INGLES, e sem a linha que o desliga ele acusa
# toda palavra em portugues. Medido antes de desligar: numa pagina de prova com
# 4 frases, 15 dos 19 alertas eram "Did you really mean 'tabela'?".
[docs/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO

[docs/**/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
