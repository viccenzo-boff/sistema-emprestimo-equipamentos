# Linter de texto da wiki. Vocabulario controlado (D03) + estilo Microsoft nas
# paginas em ingles (D13).
#
# NAO existe lint de estilo em portugues aqui, e isso e deliberado: os estilos
# prontos do Vale (Microsoft, Google) sao escritos para ingles, e nao ha estilo
# pronto de qualidade para PT-BR (especificacoes/spec-wiki.md §6.1). O que existe e um
# vocabulario proprio, que resolve o problema que importa -- duas paginas
# discordarem do nome da mesma coisa.
#
# Uso:  vale sync             (uma vez, e no CI: baixa o pacote Microsoft)
#       vale docs/            (tem que sair em 0)
# Instalacao: secao "Documentacao" do CONTRIBUTING.md.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# MinAlertLevel controla o que e EXIBIDO, e nao o que quebra o build. Medido: o
# Vale sai em 1 quando existe pelo menos um alerta de nivel `error`, e em 0 com
# qualquer quantidade de `warning` e `suggestion` -- independentemente do valor
# acima. E por isso que o criterio da D13 ("aviso nao quebra o build, erro sim")
# nao precisa de configuracao: e o comportamento nativo. O valor fica em
# `suggestion` para que a execucao manual mostre tudo o que a ferramenta viu.
#
# O pacote Microsoft e baixado pelo `vale sync` para .vale/styles/Microsoft/,
# que esta no .gitignore -- mesma regra do executavel: o que este repositorio
# versiona e a configuracao e o vocabulario, nao artefato de terceiro.
#
# A VERSAO E FIXADA pela URL, e nao pelo apelido `Microsoft`. Com o apelido, o
# `vale sync` de amanha traria outra versao e o CI passaria a reprovar (ou a
# deixar passar) texto que ninguem tocou. Mesma razao das versoes presas do
# docs-requirements.txt e do Mermaid no mkdocs.yml.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip

Vocab = Wiki

# ===========================================================================
# A ORDEM DESTAS SECOES E LOAD-BEARING, e errar nao da erro.
#
# Medido nesta maquina: quando duas secoes casam o mesmo arquivo, a de baixo
# SUBSTITUI a de cima -- nao soma --, e quem desempata e a ORDEM NO ARQUIVO, nao
# a especificidade. Invertendo os blocos, as paginas em ingles perdem o
# Microsoft e ficam so com o vocabulario; a ferramenta sai em 0, informa o
# numero certo de arquivos lidos, e o conjunto de regras aplicado e o errado.
# Por isso as secoes de docs/en/ vem DEPOIS, e por isso elas repetem `Vale` na
# lista em vez de contar com heranca: `BasedOnStyles = Vale, Microsoft` e a
# forma explicita de somar.
#
# SAO DUAS SECOES POR IDIOMA, e a segunda nao e redundante: `docs/**/*.md` NAO
# casa docs/index.md, e `docs/*.md` NAO casa docs/referencia/glossario.md.
# Medido na D03 -- com um padrao so, `vale docs/` dizia "0 files" para a arvore
# inteira abaixo do primeiro nivel e saia com sucesso. Portao mudo parece verde.
#
# Cobertura esperada hoje: 31 arquivos (16 em portugues, 15 em ingles). Se o
# rodape da saida disser menos que isso, o escopo quebrou.
# ===========================================================================

# --- Paginas em portugues: so o vocabulario controlado -------------------
#
# Vale.Spelling e um corretor de INGLES. Aqui ele acusa quase toda palavra:
# medido na D03, numa pagina de prova com 4 frases, 15 dos 19 alertas eram
# "Did you really mean 'tabela'?".

[docs/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO

[docs/**/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO

# --- Paginas em ingles: Microsoft completo + o vocabulario ----------------
#
# O vocabulario continua valendo aqui de proposito, embora o texto seja em
# ingles: estas paginas citam rotulo de tela em portugues o tempo todo (a regra
# da spec-wiki §7, `**Devolver** (Return)`), e sem ele um "aluno" ou um
# "usuario" em minuscula passaria calado justamente onde ninguem procura. Custo
# medido: zero alertas hoje.
#
# Vale.Spelling continua desligado, e aqui o numero e do proprio ingles:
# ligado, ele acusa 676 erros nas 15 paginas -- "Did you really mean
# 'Continuar'?", "'Confirmar'", "'Meus'". Sao os rotulos em portugues que a
# regra 1 do guia de estilo OBRIGA a citar literalmente.
#
# As tres regras desligadas abaixo sao de VOZ, nao de qualidade, e cada uma
# contraria uma decisao ja publicada da wiki. Medido antes de desligar: com as
# tres ligadas sao 570 erros em 15 arquivos, dos quais 569 sao delas. Sobrava 1
# erro real (Microsoft.HeadingColons), que foi corrigido no texto. As outras 44
# regras do Microsoft ficam em forca total -- e e por isso que "erro" continua
# querendo dizer alguma coisa aqui.
#
#   Microsoft.Dashes       203x. O travessao com espaco -- assim -- e a
#                          pontuacao da wiki inteira, em portugues e em ingles.
#                          O Microsoft quer "assim--sem espaco"; obedecer faria
#                          o ingles divergir tipograficamente do portugues.
#
#   Microsoft.Contractions 350x. A wiki em ingles foi escrita em registro
#                          formal na D12 ("does not", "it is"). A preferencia do
#                          Microsoft pela forma contraida e legitima, mas trocar
#                          350 pontos de prosa e revisao da D12 -- nao trabalho
#                          de uma tarefa cujo escopo e instalar portao.
#
#   Microsoft.Quotes       16x. E a convencao americana de por a pontuacao
#                          DENTRO das aspas, o que altera o texto citado --
#                          contra a regra 1 do guia de estilo, que manda
#                          transcrever a tela exatamente.

[docs/en/*.md]
BasedOnStyles = Vale, Microsoft
Vale.Spelling = NO
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.Quotes = NO

[docs/en/**/*.md]
BasedOnStyles = Vale, Microsoft
Vale.Spelling = NO
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.Quotes = NO
